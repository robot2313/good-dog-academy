name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview Expo-supported dependency repair
        run: |
          npx expo install --fix
          echo '---EXPO-LOCK-REPAIR-DIFF---'
          git diff -- package.json package-lock.json
          echo '---END-EXPO-LOCK-REPAIR-DIFF---'

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Expo Doctor
        run: npx expo-doctor@latest
