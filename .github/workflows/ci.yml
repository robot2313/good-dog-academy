name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align Expo-supported dependencies
        run: npx expo install --fix

      - name: Commit aligned package metadata on feature push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Package metadata already aligned."
            exit 0
          fi
          git commit -m "chore(deps): align Expo SDK 54 patch versions"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Expo Doctor
        run: npx expo-doctor@latest
