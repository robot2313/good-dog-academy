name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify ONNX Android registration
        run: node scripts/ensure-onnxruntime-android-registration.mjs

      - name: Prove ONNX package is in generated MainApplication
        run: |
          grep -R "ai.onnxruntime.reactnative.OnnxruntimePackage" android/app/src/main/java
          grep -R "OnnxruntimePackage()" android/app/src/main/java

      - name: Compile Android development native code
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
