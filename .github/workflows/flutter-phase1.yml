name: Flutter Migration APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-migration
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-phase1.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Flutter debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gda-flutter-debug-keystore-v1

      - name: Prepare stable Flutter debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Good Dog Academy,C=AU"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate temporary Android project
        run: |
          rm -rf /tmp/gda_flutter
          flutter create             --platforms=android             --org com.robot2313.migration             --project-name good_dog_academy             /tmp/gda_flutter

      - name: Install Good Dog Academy Flutter source
        run: |
          cp flutter_app/pubspec.yaml /tmp/gda_flutter/pubspec.yaml
          cp flutter_app/pubspec.lock /tmp/gda_flutter/pubspec.lock
          cp flutter_app/analysis_options.yaml /tmp/gda_flutter/analysis_options.yaml
          rm -rf /tmp/gda_flutter/lib
          rm -rf /tmp/gda_flutter/test
          cp -R flutter_app/lib /tmp/gda_flutter/lib
          cp -R flutter_app/test /tmp/gda_flutter/test
          rm -rf /tmp/gda_flutter/assets
          cp -R flutter_app/assets /tmp/gda_flutter/assets

      - name: Configure Android Camera Coach support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('/tmp/gda_flutter/android/app/build.gradle.kts')
          text = gradle.read_text()
          needle = 'minSdk = flutter.minSdkVersion'
          if needle not in text:
              raise SystemExit('Could not find generated Flutter minSdk setting')
          gradle.write_text(text.replace(needle, 'minSdk = 24'))

          manifest = Path('/tmp/gda_flutter/android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          manifest_tag = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if manifest_tag not in xml:
              raise SystemExit('Could not find generated Android manifest tag')

          permissions = [
              'android.permission.RECORD_AUDIO',
              'android.permission.INTERNET',
          ]
          missing_permissions = [
              f'    <uses-permission android:name="{permission}" />'
              for permission in permissions
              if permission not in xml
          ]
          if missing_permissions:
              xml = xml.replace(
                  manifest_tag,
                  manifest_tag + '\n' + '\n'.join(missing_permissions),
                  1,
              )

          application = '    <application'
          if application not in xml:
              raise SystemExit('Could not find generated Android application element')

          query_actions = []
          if 'android.intent.action.TTS_SERVICE' not in xml:
              query_actions.append('android.intent.action.TTS_SERVICE')
          if 'android.speech.RecognitionService' not in xml:
              query_actions.append('android.speech.RecognitionService')
          if query_actions:
              intents = ''.join(
                  '        <intent>\n'
                  f'            <action android:name="{action}" />\n'
                  '        </intent>\n'
                  for action in query_actions
              )
              queries = '    <queries>\n' + intents + '    </queries>\n'
              xml = xml.replace(application, queries + application, 1)

          manifest.write_text(xml)
          PY

      - name: Get dependencies
        working-directory: /tmp/gda_flutter
        run: flutter pub get

      - name: Upload resolved Flutter lockfile
        uses: actions/upload-artifact@v4
        with:
          name: good-dog-academy-flutter-vision-lock
          path: /tmp/gda_flutter/pubspec.lock
          retention-days: 1

      - name: Verify Flutter lockfile is current
        run: cmp flutter_app/pubspec.lock /tmp/gda_flutter/pubspec.lock

      - name: Format Flutter source
        working-directory: /tmp/gda_flutter
        run: dart format lib test

      - name: Analyze
        working-directory: /tmp/gda_flutter
        run: flutter analyze

      - name: Run tests
        working-directory: /tmp/gda_flutter
        run: flutter test

      - name: Build Android APK
        working-directory: /tmp/gda_flutter
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: good-dog-academy-flutter-migration
          path: /tmp/gda_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
