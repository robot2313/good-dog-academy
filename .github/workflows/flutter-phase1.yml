name: Flutter Migration APK

on:
  workflow_dispatch:
    inputs:
      vision_qa:
        description: 'Include private engineering vision benchmark and verified Model A assets'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - feature/flutter-migration
      - work/flutter-camera-phase1
      - work/flutter-camera-recording-fixes
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-phase1.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      FLUTTER_SUPPRESS_ANALYTICS: true
      GDA_PRIVATE_QA: ${{ inputs.vision_qa == true || github.ref == 'refs/heads/work/flutter-camera-phase1' || github.ref == 'refs/heads/work/flutter-camera-recording-fixes' }}
      GDA_RECORDING_QA: ${{ github.ref == 'refs/heads/work/flutter-camera-recording-fixes' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Flutter debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gda-flutter-debug-keystore-v1

      - name: Prepare stable Flutter debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Good Dog Academy,C=AU"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate temporary Android project
        run: |
          rm -rf /tmp/gda_flutter
          flutter create             --platforms=android             --org com.robot2313.migration             --project-name good_dog_academy             /tmp/gda_flutter

      - name: Install Good Dog Academy Flutter source
        run: |
          cp flutter_app/pubspec.yaml /tmp/gda_flutter/pubspec.yaml
          cp flutter_app/pubspec.lock /tmp/gda_flutter/pubspec.lock
          cp flutter_app/analysis_options.yaml /tmp/gda_flutter/analysis_options.yaml
          rm -rf /tmp/gda_flutter/lib
          rm -rf /tmp/gda_flutter/test
          cp -R flutter_app/lib /tmp/gda_flutter/lib
          cp -R flutter_app/test /tmp/gda_flutter/test
          rm -rf /tmp/gda_flutter/assets
          cp -R flutter_app/assets /tmp/gda_flutter/assets

      - name: Configure Android Camera Coach support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          gradle = Path('/tmp/gda_flutter/android/app/build.gradle.kts')
          text = gradle.read_text()
          needle = 'minSdk = flutter.minSdkVersion'
          if needle not in text:
              raise SystemExit('Could not find generated Flutter minSdk setting')

          text = text.replace(needle, 'minSdk = 24', 1)

          vision_qa = os.environ['GDA_PRIVATE_QA'] == 'true'
          recording_qa = os.environ['GDA_RECORDING_QA'] == 'true'
          if vision_qa:
              normal_app_id = (
                  'applicationId = "com.robot2313.migration.good_dog_academy"'
              )
              qa_app_id = (
                  'applicationId = "com.robot2313.migration.good_dog_academy.qa.'
                  + ('camera_recovery_v4' if recording_qa else 'camera_phase1') + '"'
              )
              if normal_app_id not in text:
                  raise SystemExit('Could not find generated Android applicationId')
              text = text.replace(normal_app_id, qa_app_id, 1)

          gradle.write_text(text)

          manifest = Path('/tmp/gda_flutter/android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()

          if vision_qa:
              normal_label = 'android:label="good_dog_academy"'
              qa_label = 'android:label="' + ('GDA Camera Recovery QA' if recording_qa else 'GDA Camera Phase 1 QA') + '"'
              if normal_label not in xml:
                  raise SystemExit('Could not find generated Android app label')
              xml = xml.replace(normal_label, qa_label, 1)
          manifest_tag = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if manifest_tag not in xml:
              raise SystemExit('Could not find generated Android manifest tag')

          permissions = [
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.INTERNET',
          ]
          missing_permissions = [
              f'    <uses-permission android:name="{permission}" />'
              for permission in permissions
              if permission not in xml
          ]
          if missing_permissions:
              xml = xml.replace(
                  manifest_tag,
                  manifest_tag + '\n' + '\n'.join(missing_permissions),
                  1,
              )

          application = '    <application'
          if application not in xml:
              raise SystemExit('Could not find generated Android application element')

          query_actions = []
          if 'android.intent.action.TTS_SERVICE' not in xml:
              query_actions.append('android.intent.action.TTS_SERVICE')
          if 'android.speech.RecognitionService' not in xml:
              query_actions.append('android.speech.RecognitionService')
          if query_actions:
              intents = ''.join(
                  '        <intent>\n'
                  f'            <action android:name="{action}" />\n'
                  '        </intent>\n'
                  for action in query_actions
              )
              queries = '    <queries>\n' + intents + '    </queries>\n'
              xml = xml.replace(application, queries + application, 1)

          manifest.write_text(xml)

          proguard = Path('/tmp/gda_flutter/android/app/proguard-rules.pro')
          rule = '-keep class ai.onnxruntime.** { *; }'
          existing = proguard.read_text() if proguard.exists() else ''
          if rule not in existing:
              if existing and not existing.endswith('\n'):
                  existing += '\n'
              proguard.write_text(existing + rule + '\n')
          PY

      - name: Provision private Model A QA assets
        if: ${{ env.GDA_PRIVATE_QA == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/gda-model-a-venv"
          "$RUNNER_TEMP/gda-model-a-venv/bin/pip" install \
            onnx==1.23.1 \
            onnxruntime==1.30.0 \
            numpy
          "$RUNNER_TEMP/gda-model-a-venv/bin/python" \
            tools/vision_qa/provision_model_a.py \
            --cache "$RUNNER_TEMP/gda-model-a-cache" \
            --output /tmp/gda_flutter/assets/vision-qa-model-a

          python3 - <<'PY2'
          from pathlib import Path

          pubspec = Path('/tmp/gda_flutter/pubspec.yaml')
          text = pubspec.read_text()
          entry = '    - assets/vision-qa-model-a/\n'

          if entry not in text:
              needle = '  assets:\n'
              if needle not in text:
                  raise SystemExit('Expected Flutter assets section')
              text = text.replace(needle, needle + entry, 1)

          pubspec.write_text(text)
          PY2

      - name: Get dependencies
        working-directory: /tmp/gda_flutter
        run: flutter pub get

      - name: Verify Flutter lockfile is current
        run: cmp flutter_app/pubspec.lock /tmp/gda_flutter/pubspec.lock

      - name: Format Flutter source
        working-directory: /tmp/gda_flutter
        run: dart format lib test

      - name: Analyze
        working-directory: /tmp/gda_flutter
        run: flutter analyze

      - name: Run tests
        working-directory: /tmp/gda_flutter
        run: flutter test

      - name: Build Android APK
        working-directory: /tmp/gda_flutter
        run: |
          if [ "$GDA_PRIVATE_QA" = "true" ]; then
            flutter build apk --debug \
              --dart-define=GDA_VISION_QA=true \
              --dart-define=GDA_VISION_MODEL_A=true
          else
            flutter build apk --debug
          fi

      - name: Verify private QA APK identity and models
        if: ${{ env.GDA_PRIVATE_QA == 'true' }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          apk = Path('/tmp/gda_flutter/build/app/outputs/flutter-apk/app-debug.apk')
          tools = sorted(Path(os.environ['ANDROID_HOME']).glob('build-tools/*/aapt'))
          if not tools:
              raise SystemExit('Android aapt is required to verify the QA package')
          aapt = tools[-1]
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          recording_qa = os.environ['GDA_RECORDING_QA'] == 'true'
          suffix = 'camera_recovery_v4' if recording_qa else 'camera_phase1'
          label = 'GDA Camera Recovery QA' if recording_qa else 'GDA Camera Phase 1 QA'
          expected = "package: name='com.robot2313.migration.good_dog_academy.qa." + suffix + "'"
          if expected not in badging or "application-label:'" + label + "'" not in badging:
              raise SystemExit('QA APK must have the isolated Camera Phase 1 identity')
          if "sdkVersion:'24'" not in badging:
              raise SystemExit('Unexpected QA Android minimum API')
          subprocess.run([str(aapt.with_name('apksigner')), 'verify', '--verbose', str(apk)], check=True)
          with zipfile.ZipFile(apk) as bundle:
              root = 'assets/flutter_assets/assets/vision-qa-model-a/'
              metadata = json.loads(bundle.read(root + 'manifest.json'))
              if metadata.get('production_approved') is not False or metadata.get('usage') != 'private-engineering-qa':
                  raise SystemExit('Private engineering model gates missing')
              hashes = {
                  'rtmdet-tiny.onnx': 'a6f06381c68334f09e134d8ca7e062f4e756eaf662bb110752e80b7290470b5e',
                  'rtmpose-ap10k-packed.onnx': '8f8b474bc0009e9e023897e5999e67ac3ed583f412b1ed0571234c4bb661c32e',
              }
              for name, expected_hash in hashes.items():
                  if hashlib.sha256(bundle.read(root + name)).hexdigest() != expected_hash:
                      raise SystemExit('QA model checksum failed: ' + name)
          print('PASS: isolated QA package, label, Android API, signing and model hashes')
          PY

      - name: Encrypt private QA APK
        if: ${{ env.GDA_PRIVATE_QA == 'true' }}
        run: |
          sha256sum /tmp/gda_flutter/build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/private-qa-apk.sha256"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in /tmp/gda_flutter/build/app/outputs/flutter-apk/app-debug.apk \
            -out "$RUNNER_TEMP/gda-private-qa.apk.cms" -outform DER \
            tools/vision_qa/qa_artifact_recipient.pem

      - name: Upload encrypted private QA APK
        if: ${{ env.GDA_PRIVATE_QA == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: good-dog-academy-private-qa-encrypted
          path: |
            ${{ runner.temp }}/gda-private-qa.apk.cms
            ${{ runner.temp }}/private-qa-apk.sha256
          retention-days: 14

      - name: Upload APK
        if: ${{ env.GDA_PRIVATE_QA != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: good-dog-academy-flutter-migration
          path: /tmp/gda_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
