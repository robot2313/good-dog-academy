name: Repair Expo lockfile

on:
  push:
    branches:
      - feature/milestone-14-lesson-media-completion

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): align Expo SDK 54 patch versions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/milestone-14-lesson-media-completion
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate package metadata at Expo-supported patch versions
        run: npm install --package-lock-only --save 'expo@~54.0.37' 'expo-file-system@~19.0.24' 'jest-expo@~54.0.18'

      - name: Commit regenerated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): align Expo SDK 54 patch versions"
          git push origin HEAD:feature/milestone-14-lesson-media-completion
