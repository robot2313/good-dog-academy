name: Sync Expo Speech Lock

on:
  push:
    branches:
      - feature/adaptive-training-port
    paths:
      - .github/workflows/sync-expo-speech-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/adaptive-training-port
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Expo speech and refresh lock
        run: npm install expo-speech@~14.0.8 --save
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed."
            exit 0
          fi
          git commit -m "Add Expo speech dependency"
          git push origin HEAD:feature/adaptive-training-port
