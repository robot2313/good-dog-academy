name: Sync speech recognition lockfile

on:
  push:
    branches:
      - feature/adaptive-training-port
    paths:
      - package.json
      - .github/workflows/sync-speech-recognition-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-training-port
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync lockfile for speech recognition"
          git pull --rebase origin feature/adaptive-training-port
          git push origin HEAD:feature/adaptive-training-port
