name: Vision lock sync

on:
  push:
    branches:
      - feature/adaptive-training-port
    paths:
      - .github/workflows/vision-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-training-port
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install onnxruntime-react-native@1.24.3 --save
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Add React Native ONNX runtime"
          git pull --rebase origin feature/adaptive-training-port
          git push origin HEAD:feature/adaptive-training-port
