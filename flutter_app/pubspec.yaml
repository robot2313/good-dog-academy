name: good_dog_academy
description: Good Dog Academy Flutter migration.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  image_picker: ^1.2.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/lesson-images/
    - assets/lesson-step-images/
